org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Two independent modules/tasks can run at once, and the test and build jobs in
# CI can reuse each other's task outputs.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 full mode is the AGP 8 default; kept explicit so a future toolchain change
# cannot silently fall back to the less optimising compatibility mode.
android.enableR8.fullMode=true
kotlin.code.style=official

# The version of the app. Bumped by hand for each release (built and signed on
# the owner's PC); CI builds read it too and never publish.
mangacracker.versionName=1.9.2
mangacracker.versionCode=17
